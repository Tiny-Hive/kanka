name: build and push image

on:
  push:
    branches: [develop, main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'app/**'
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'routes/**'
      - 'public/**'
      - 'composer.*'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: k3s-microvm   # self-hosted Kata microVM with dind (ARC on centaur); GitHub-hosted runs get 0 steps
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker   # dockerd's built-in BuildKit (works in the microVM)

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tiny-hive/kanka:latest
            ghcr.io/tiny-hive/kanka:${{ github.sha }}
          pull: true   # always take the newest php:8.4-fpm-alpine (security fixes)
